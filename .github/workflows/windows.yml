name: CI (Windows)

on: [push, pull_request]

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        version:
          - stable
          - nightly

    name: ${{ matrix.version }} - x86_64-pc-windows-msvc
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@nextest

      - name: Install ${{ matrix.version }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.version }}-x86_64-pc-windows-msvc

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      # redis server is not available on windows runners,
      # build all targets and run unit tests only
      - name: Build [neon]
        run: cargo build --all --all-targets

      - name: Run unit tests [neon]
        timeout-minutes: 10
        run: cargo nextest run --retries=3 --all --lib

      - name: Build [tokio]
        run: cargo build --all --all-targets --features="ntex/tokio"

      - name: Run unit tests [tokio]
        timeout-minutes: 10
        run: cargo nextest run --retries=3 --all --lib --features="ntex/tokio"
