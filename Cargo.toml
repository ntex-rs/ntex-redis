[package]
name = "ntex-redis"
version = "3.0.0"
authors = ["ntex contributors <team@ntex.rs>"]
description = "Redis client"
documentation = "https://docs.rs/ntex-redis"
repository = "https://github.com/ntex-rs/ntex-redis.git"
categories = ["network-programming"]
keywords = ["ntex", "redis"]
license = "MIT OR Apache-2.0"
exclude = [".gitignore", ".travis.yml", ".cargo/config"]
edition = "2024"
rust-version = "1.97"

[dependencies]
ntex-bytes = "1.11"
ntex-codec = "2.0"
ntex-error = "3.0"
ntex-io = "4.3"
ntex-net = "4.4"
ntex-service = "5.2"
ntex-util = "4.3"
itoa = "1.0"
btoi = "0.4"
log = "0.4"
thiserror = "2"

[dev-dependencies]
rand = "0.9"
env_logger = "0.11"
ntex = "4.2"
